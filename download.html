---
title: Download
---
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download Warlock</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-2: #f1f3f6;
            --border: #e3e6eb;
            --text: #131417;
            --text-muted: #5b6068;
            --accent: #8e42bb;
            --accent-hover: #7a37a3;
            --accent-text: #ffffff;
            --beta: #d97706;
            --beta-bg: #fff7ed;
            --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1115;
                --surface: #1a1d23;
                --surface-2: #22262d;
                --border: #2a2f37;
                --text: #e7e9ed;
                --text-muted: #9aa1ac;
                --accent: #a45ed1;
                --accent-hover: #b273db;
                --accent-text: #ffffff;
                --beta: #fbbf24;
                --beta-bg: #2a210f;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        header img {
            width: 56px;
            height: 56px;
            border-radius: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 2px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .channel-banner {
            display: none;
            background: var(--beta-bg);
            border: 1px solid var(--beta);
            color: var(--beta);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .channel-banner.show { display: block; }
        .channel-banner a { color: inherit; }

        .channel-switch {
            display: inline-flex;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            margin-bottom: 24px;
        }

        .channel-switch a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color .15s, background .15s;
        }

        .channel-switch a.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .channel-switch a:hover:not(.active) {
            color: var(--text);
        }

        .primary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .primary-os {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .primary-os svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .primary-version {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .primary-version strong {
            color: var(--text);
            font-weight: 600;
        }

        .download-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: background .15s, transform .05s, border-color .15s;
            min-width: 260px;
        }

        .download-button.primary {
            background: var(--accent);
            color: var(--accent-text);
            font-size: 1.05rem;
            padding: 14px 28px;
        }

        .download-button.primary:hover {
            background: var(--accent-hover);
        }

        .download-button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 0.95rem;
            padding: 10px 22px;
        }

        .download-button.secondary:hover {
            border-color: var(--accent);
        }

        .download-button:active {
            transform: translateY(1px);
        }

        .download-button svg.icon-left {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .primary-meta {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .primary-meta a {
            color: var(--text-muted);
        }

        .play-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 12px;
            min-width: 260px;
            justify-content: center;
            transition: opacity .15s, transform .05s;
        }

        .play-badge:hover { opacity: 0.9; }
        .play-badge:active { transform: translateY(1px); }

        .play-badge svg { width: 24px; height: 24px; }

        .play-badge .text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
        .play-badge .text .small { font-size: 0.7rem; opacity: 0.85; }
        .play-badge .text .big { font-size: 1rem; font-weight: 600; }

        .other-platforms {
            margin-top: 36px;
        }

        .other-platforms h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0 0 14px;
        }

        .platform-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 560px) {
            .platform-grid { grid-template-columns: 1fr 1fr; }
        }

        .platform-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text);
            transition: border-color .15s, transform .05s;
        }

        .platform-card:hover {
            border-color: var(--accent);
        }

        .platform-card:active {
            transform: translateY(1px);
        }

        .platform-card .platform-icon {
            width: 32px;
            height: 32px;
            background: var(--surface-2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .platform-card .platform-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--text);
        }

        .platform-card .label {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .platform-card .label .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .platform-card .label .meta {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .platform-card > svg.arrow {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        .error, .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 24px;
        }

        .error a {
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 48px;
        }

        footer a {
            color: var(--text-muted);
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="page">
    <header>
        <img src="icon.png" alt="Warlock">
        <div>
            <h1>Warlock</h1>
            <p>An open source front end for Simutronics games</p>
        </div>
    </header>

    <div id="channel-banner" class="channel-banner">
        <strong>Beta channel.</strong>
        These builds are pre-release and may be unstable.
        <a id="switch-to-stable" href="?channel=stable">Switch to stable</a>.
        <span id="stable-newer" hidden></span>
    </div>

    <nav class="channel-switch" aria-label="Release channel">
        <a id="tab-stable" href="?channel=stable">Stable</a>
        <a id="tab-beta" href="?channel=beta">Beta</a>
    </nav>

    <section class="primary-card" id="primary-card">
        <div id="loading" class="loading">Loading latest release&hellip;</div>

        <div id="primary-content" hidden>
            <div class="primary-os" id="primary-os"></div>
            <div class="primary-version" id="primary-version-line">
                Version <strong id="primary-version">&mdash;</strong>
            </div>
            <div class="download-actions" id="download-actions"></div>
            <div class="primary-meta" id="primary-meta"></div>
        </div>

        <div id="error" class="error" hidden></div>
    </section>

    <section class="other-platforms" id="other-platforms" hidden>
        <h2>Other platforms</h2>
        <div class="platform-grid" id="platform-grid"></div>
    </section>

    <footer>
        <p>
            <a href="https://github.com/sproctor/warlock3/releases">All releases</a>
            &middot;
            <a href="https://github.com/sproctor/warlock3/wiki">Documentation</a>
            &middot;
            <a href="/">warlockfe.github.io</a>
        </p>
    </footer>
</div>

<script>
(function () {
    var REPO = 'sproctor/warlock3';
    var RELEASES_API = 'https://api.github.com/repos/' + REPO + '/releases?per_page=30';
    var RELEASES_PAGE = 'https://github.com/' + REPO + '/releases';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=warlockfe.warlock3';

    // ---------- channel ----------
    // The beta channel is selected with ?channel=beta (the URL hash is used
    // for platform deep-links). Stable is the latest non-prerelease GitHub
    // release; beta is the latest prerelease.
    var isBeta = new URLSearchParams(location.search).get('channel') === 'beta';
    var channel = isBeta ? 'beta' : 'stable';
    document.getElementById(isBeta ? 'tab-beta' : 'tab-stable').classList.add('active');
    if (isBeta) document.getElementById('channel-banner').classList.add('show');

    // ---------- platform icons ----------
    // Simple monochrome glyphs. The fill comes from CSS so they work in
    // both light and dark themes.
    var icons = {
        win: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.1 10.5 4v7.5H3V5.1zM11.5 3.9 21 2.5v9H11.5V3.9zM3 12.5h7.5V20L3 18.9v-6.4zM11.5 12.5H21v9l-9.5-1.4v-7.6z"/></svg>',
        mac: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.03 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702z"/></svg>',
        linux: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-2.2 0-3.6 1.8-3.6 4 0 1 .3 1.9.7 2.5-.7.8-1.6 2-1.8 3.2-.3 2-.7 3.1-1.6 4.2-1 1.2-1.7 1.9-1.7 3 0 .9.6 1.4 1.4 1.7.5.2 1 .4 1.3.8.4.5.7 1.2 1.4 1.6.7.4 1.6.5 2.7.1.6-.2 1.2-.2 1.8 0 1.1.4 2 .3 2.7-.1.7-.4 1-1.1 1.4-1.6.3-.4.8-.6 1.3-.8.8-.3 1.4-.8 1.4-1.7 0-1.1-.7-1.8-1.7-3-.9-1.1-1.3-2.2-1.6-4.2-.2-1.2-1.1-2.4-1.8-3.2.4-.6.7-1.5.7-2.5 0-2.2-1.4-4-3.6-4zm-1.5 4.5c.5 0 .9.6.9 1.3s-.4 1.3-.9 1.3-.9-.6-.9-1.3.4-1.3.9-1.3zm3 0c.5 0 .9.6.9 1.3s-.4 1.3-.9 1.3-.9-.6-.9-1.3.4-1.3.9-1.3z"/></svg>',
        android: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 9.5l1.7-2.9c.1-.2 0-.4-.1-.5-.2-.1-.4 0-.5.1l-1.7 3c-1.5-.7-3.1-1-4.9-1s-3.4.4-4.9 1L5.4 6.2c-.1-.2-.3-.2-.5-.1-.1.1-.2.3-.1.5l1.7 2.9C3.4 11.1 1.4 13.9 1 17h22c-.4-3.1-2.4-5.9-5.4-7.5zM7 14.6c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm10 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9z"/></svg>'
    };

    var platforms = {
        win: { name: 'Windows', icon: icons.win, kind: 'desktop' },
        mac: { name: 'macOS', icon: icons.mac, kind: 'desktop' },
        linux: { name: 'Linux', icon: icons.linux, kind: 'desktop' },
        android: { name: 'Android', icon: icons.android, kind: 'store', playStoreUrl: PLAY_STORE }
    };

    // ---------- asset classification ----------
    // Release assets are classified by filename instead of a hardcoded list,
    // so new artifact types show up without touching this page. Updater
    // plumbing (.yml manifests, .blockmap, the macOS auto-update .zip) is
    // skipped.
    function classifyAsset(asset) {
        var n = asset.name;
        if (/\.(yml|yaml|blockmap|txt|sig|asc|sha256|sha512)$/i.test(n)) return null;

        var arch = /arm64|aarch64/i.test(n) ? 'arm64' : 'x64';
        var os = null, ext = null, hint = null, rank = 9;

        if (/\.exe$/i.test(n)) {
            os = 'win'; ext = '.exe'; hint = 'Installer'; rank = 0;
        } else if (/\.msi$/i.test(n)) {
            os = 'win'; ext = '.msi'; hint = 'MSI installer'; rank = 1;
        } else if (/\.dmg$/i.test(n)) {
            os = 'mac'; ext = '.dmg';
            hint = arch === 'arm64' ? 'Apple Silicon' : 'Intel'; rank = 0;
        } else if (/\.deb$/i.test(n)) {
            os = 'linux'; ext = '.deb'; hint = 'Debian / Ubuntu'; rank = 0;
        } else if (/\.appimage$/i.test(n)) {
            os = 'linux'; ext = '.AppImage'; hint = 'AppImage'; rank = 1;
        } else if (/\.rpm$/i.test(n)) {
            os = 'linux'; ext = '.rpm'; hint = 'RPM package'; rank = 2;
        } else if (/\.(tar\.gz|tgz|tar\.xz)$/i.test(n)) {
            os = 'linux'; ext = '.tar.gz'; hint = 'Tarball'; rank = 3;
        } else if (/\.apk$/i.test(n)) {
            os = 'android'; ext = '.apk'; hint = 'APK'; rank = 0;
        }
        // .zip is only published as the macOS auto-updater artifact; skip it
        // along with anything else unrecognized.
        if (!os) return null;

        return {
            os: os,
            arch: arch,
            ext: ext,
            hint: hint,
            rank: rank,
            url: asset.browser_download_url,
            size: asset.size
        };
    }

    // Formats for one OS, best-first: preferred architecture beats format
    // rank, so e.g. an arm64 Linux user sees the arm64 .deb as primary.
    function formatsFor(release, os, preferredArch) {
        return release.assets
            .map(classifyAsset)
            .filter(function (f) { return f && f.os === os; })
            .sort(function (a, b) {
                var aScore = (a.arch === preferredArch ? 0 : 100) + a.rank;
                var bScore = (b.arch === preferredArch ? 0 : 100) + b.rank;
                return aScore - bScore;
            })
            .map(function (f, i) {
                var label = 'Download ' + f.ext;
                if (f.os === 'mac') {
                    label = 'Download ' + f.ext + ' (' + f.hint + ')';
                } else if (f.arch !== preferredArch) {
                    label = 'Download ' + f.ext + ' (' + f.arch.toUpperCase() + ')';
                }
                return { label: label, url: f.url, size: f.size, primary: i === 0 };
            });
    }

    // ---------- OS + architecture detection ----------
    function detectPlatform() {
        var fallback = detectLegacy();
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            return navigator.userAgentData.getHighEntropyValues(['platform', 'architecture'])
                .then(function (data) {
                    var p = (data.platform || '').toLowerCase();
                    var mobile = navigator.userAgentData.mobile;
                    var os = null;
                    if (p.indexOf('android') !== -1 || (mobile && p.indexOf('linux') !== -1)) os = 'android';
                    else if (p.indexOf('win') !== -1) os = 'win';
                    else if (p.indexOf('mac') !== -1) os = 'mac';
                    else if (p.indexOf('linux') !== -1) os = 'linux';
                    var arch = (data.architecture || '').indexOf('arm') !== -1 ? 'arm64' : null;
                    return { os: os || fallback.os, arch: arch || archDefault(os || fallback.os) };
                })
                .catch(function () { return fallback; });
        }
        return Promise.resolve(fallback);
    }

    function detectLegacy() {
        var ua = (navigator.userAgent || navigator.appVersion || '').toLowerCase();
        var os = null;
        if (ua.indexOf('android') !== -1) os = 'android';
        else if (/iphone|ipad|ipod/.test(ua)) os = null;
        else if (ua.indexOf('win') !== -1) os = 'win';
        else if (ua.indexOf('mac') !== -1) os = 'mac';
        else if (ua.indexOf('linux') !== -1 || ua.indexOf('x11') !== -1) os = 'linux';
        return { os: os, arch: archDefault(os) };
    }

    // Without a definitive answer, assume Apple Silicon on macOS and x64
    // elsewhere.
    function archDefault(os) {
        return os === 'mac' ? 'arm64' : 'x64';
    }

    // ---------- formatting helpers ----------
    function formatBytes(bytes) {
        if (!bytes && bytes !== 0) return '';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function renderError(msg) {
        document.getElementById('loading').hidden = true;
        var err = document.getElementById('error');
        err.innerHTML = '';
        err.appendChild(document.createTextNode(msg + ' '));
        var a = document.createElement('a');
        a.href = RELEASES_PAGE;
        a.textContent = 'Browse releases on GitHub';
        err.appendChild(a);
        err.appendChild(document.createTextNode('.'));
        err.hidden = false;
    }

    function makeDownloadIcon() {
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('class', 'icon-left');
        svg.setAttribute('aria-hidden', 'true');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 3a1 1 0 0 1 1 1v9.586l3.293-3.293a1 1 0 1 1 1.414 1.414l-5 5a1 1 0 0 1-1.414 0l-5-5a1 1 0 1 1 1.414-1.414L11 13.586V4a1 1 0 0 1 1-1Zm-7 15a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z');
        svg.appendChild(path);
        return svg;
    }

    function renderPrimaryDesktop(osKey, release, files) {
        var def = platforms[osKey];

        var osLabel = document.getElementById('primary-os');
        osLabel.innerHTML = def.icon + '<span>For ' + def.name + '</span>';

        document.getElementById('primary-version').textContent =
            (release.tag_name || '').replace(/^v/, '') || '—';

        var actions = document.getElementById('download-actions');
        actions.innerHTML = '';
        files.forEach(function (f) {
            var a = document.createElement('a');
            a.className = 'download-button ' + (f.primary ? 'primary' : 'secondary');
            a.href = f.url;
            a.appendChild(makeDownloadIcon());
            var label = document.createElement('span');
            label.textContent = f.label;
            a.appendChild(label);
            actions.appendChild(a);
        });

        // Meta line — size of the primary file, release date, release notes
        var meta = document.getElementById('primary-meta');
        meta.innerHTML = '';
        var bits = [];
        var primary = files[0];
        var sz = primary ? formatBytes(primary.size) : '';
        if (sz) bits.push(sz);
        var dateText = formatDate(release.published_at);
        if (dateText) bits.push('Released ' + dateText);
        meta.appendChild(document.createTextNode(bits.join(' · ')));
        if (release.html_url) {
            meta.appendChild(document.createTextNode(' · '));
            var notes = document.createElement('a');
            notes.href = release.html_url;
            notes.textContent = 'Release notes';
            meta.appendChild(notes);
        }

        document.getElementById('loading').hidden = true;
        document.getElementById('primary-content').hidden = false;
    }

    function renderPrimaryAndroid() {
        document.getElementById('primary-os').innerHTML = icons.android + '<span>For Android</span>';
        document.getElementById('primary-version-line').hidden = true;

        var actions = document.getElementById('download-actions');
        actions.innerHTML = '';
        var a = document.createElement('a');
        a.className = 'play-badge';
        a.href = PLAY_STORE;
        // Google Play triangle (simplified)
        a.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path fill="#34A853" d="M3 3l9 9-9 9V3z" opacity=".85"/>' +
              '<path fill="#EA4335" d="M3 3l13.5 7.5L13 12 3 3z"/>' +
              '<path fill="#FBBC04" d="M16.5 10.5L20 12l-3.5 1.5L13 12l3.5-1.5z"/>' +
              '<path fill="#4285F4" d="M3 21l13.5-7.5L13 12 3 21z"/>' +
            '</svg>' +
            '<span class="text"><span class="small">GET IT ON</span><span class="big">Google Play</span></span>';
        actions.appendChild(a);

        document.getElementById('primary-meta').textContent = 'Available on the Google Play Store';
        document.getElementById('loading').hidden = true;
        document.getElementById('primary-content').hidden = false;
    }

    // Bottom section: cards for the platforms that are NOT the currently
    // shown one. Clicking a card swaps the primary view to that platform
    // (so the user can see all available formats for it), except for
    // Android, which goes straight to the Play Store.
    function renderOtherPlatforms(currentOs) {
        var grid = document.getElementById('platform-grid');
        grid.innerHTML = '';
        var order = ['win', 'mac', 'linux', 'android'];
        var rendered = 0;
        order.forEach(function (os) {
            if (os === currentOs) return;
            var def = platforms[os];
            var meta;
            var href;
            if (def.kind === 'store') {
                href = def.playStoreUrl;
                meta = 'Google Play';
            } else {
                if (!state.release || formatsFor(state.release, os, 'x64').length === 0) return;
                href = '#' + os;
                meta = 'View downloads';
            }
            var card = document.createElement('a');
            card.className = 'platform-card';
            card.href = href;
            if (def.kind === 'store') {
                card.setAttribute('rel', 'noopener');
                card.setAttribute('target', '_blank');
            }

            var iconWrap = document.createElement('div');
            iconWrap.className = 'platform-icon';
            iconWrap.innerHTML = def.icon;
            card.appendChild(iconWrap);

            var label = document.createElement('div');
            label.className = 'label';
            var name = document.createElement('span');
            name.className = 'name';
            name.textContent = def.name;
            var sub = document.createElement('span');
            sub.className = 'meta';
            sub.textContent = meta;
            label.appendChild(name);
            label.appendChild(sub);
            card.appendChild(label);

            var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            arrow.setAttribute('viewBox', '0 0 24 24');
            arrow.setAttribute('class', 'arrow');
            arrow.setAttribute('aria-hidden', 'true');
            var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', 'M9 6l6 6-6 6');
            p.setAttribute('fill', 'none');
            p.setAttribute('stroke', 'currentColor');
            p.setAttribute('stroke-width', '2');
            p.setAttribute('stroke-linecap', 'round');
            p.setAttribute('stroke-linejoin', 'round');
            arrow.appendChild(p);
            card.appendChild(arrow);

            grid.appendChild(card);
            rendered++;
        });
        if (rendered > 0) document.getElementById('other-platforms').hidden = false;
    }

    // ---------- state + view selection ----------
    // The chosen release + detected platform are stashed once and reused
    // whenever the user switches platforms via the bottom cards.
    var state = { release: null, detected: null };

    function showPlatform(os) {
        if (!state.release && os !== 'android') return;

        // Reset transient UI bits that may have been hidden/shown last time.
        document.getElementById('error').hidden = true;
        document.getElementById('primary-content').hidden = true;
        document.getElementById('loading').hidden = false;
        document.getElementById('primary-version-line').hidden = false;

        if (os === 'android') {
            renderPrimaryAndroid();
            renderOtherPlatforms('android');
            return;
        }

        var preferredArch = (state.detected && state.detected.os === os)
            ? state.detected.arch
            : archDefault(os);
        var files = formatsFor(state.release, os, preferredArch);
        if (files.length === 0) {
            renderError('No downloads are available for ' + platforms[os].name +
                        ' on the ' + channel + ' channel yet.');
            renderOtherPlatforms(os);
            return;
        }
        renderPrimaryDesktop(os, state.release, files);
        renderOtherPlatforms(os);
    }

    function platformFromHash() {
        var h = (location.hash || '').replace(/^#/, '').toLowerCase();
        if (h === 'win' || h === 'mac' || h === 'linux' || h === 'android') return h;
        return null;
    }

    window.addEventListener('hashchange', function () {
        var os = platformFromHash() || (state.detected && state.detected.os);
        if (os) {
            showPlatform(os);
            // Scroll back to the top of the page so the user sees the
            // freshly-rendered primary card.
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    // ---------- entrypoint ----------
    // One API call covers both channels: the latest non-prerelease is the
    // stable release, the latest prerelease is the beta.
    function fetchReleases() {
        return fetch(RELEASES_API, { headers: { Accept: 'application/vnd.github+json' } })
            .then(function (r) {
                if (!r.ok) throw new Error('GitHub API returned ' + r.status);
                return r.json();
            });
    }

    Promise.all([detectPlatform(), fetchReleases()]).then(function (results) {
        state.detected = results[0];
        var releases = results[1].filter(function (r) { return !r.draft; });
        var stable = releases.find(function (r) { return !r.prerelease; }) || null;
        var beta = releases.find(function (r) { return r.prerelease; }) || null;

        state.release = isBeta ? beta : stable;

        // If the stable release is newer than the latest beta, say so in the
        // beta banner — beta users would otherwise grab an older build.
        if (isBeta && stable && beta &&
            new Date(stable.published_at) > new Date(beta.published_at)) {
            var note = document.getElementById('stable-newer');
            note.textContent = 'Note: the current stable release (' +
                (stable.tag_name || '').replace(/^v/, '') +
                ') is newer than this beta.';
            note.hidden = false;
        }

        if (!state.release) {
            renderError('No releases are available on the ' + channel + ' channel yet.');
            renderOtherPlatforms(null);
            return;
        }

        // Pick the initial view: explicit hash wins, then detected OS,
        // then the first desktop platform with a download.
        var primaryOs = platformFromHash() || (state.detected && state.detected.os);
        if (primaryOs && primaryOs !== 'android' &&
            formatsFor(state.release, primaryOs, 'x64').length === 0) {
            primaryOs = null;
        }
        if (!primaryOs) {
            primaryOs = ['win', 'mac', 'linux'].find(function (os) {
                return formatsFor(state.release, os, 'x64').length > 0;
            }) || null;
        }

        if (!primaryOs) {
            renderError('No downloads are available on the ' + channel + ' channel yet.');
            renderOtherPlatforms(null);
            return;
        }

        showPlatform(primaryOs);
    }).catch(function () {
        renderError('Could not load release information from GitHub.');
    });
})();
</script>
</body>
</html>
